name: 'Automation: Jules PR Retarget'

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  retarget-jules-pr:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.base.ref == 'master' && (
        startsWith(github.event.pull_request.head.ref, 'fix/remediate-') ||
        contains(github.event.pull_request.head.ref, 'jules') ||
        contains(github.event.pull_request.body, 'jules.google.com/task/') ||
        contains(github.event.pull_request.body, 'PR created automatically by Jules')
      )
    steps:
      - name: Retarget PR base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          TARGET_BRANCH=""

          # 1. Try to extract "Target Branch: <branch>" or "Target Branch: `<branch>`" from the PR description
          if [[ "$PR_BODY" =~ [Tt]arget\ [Bb]ranch:?\ ?\`?([a-zA-Z0-9_./-]+)\`? ]]; then
            TARGET_BRANCH="${BASH_REMATCH[1]}"
            echo "Found target branch in PR description: $TARGET_BRANCH"
          fi

          # 2. If not found in PR description, check for linked issue "Fixes #<number>" or "Closes #<number>"
          if [ -z "$TARGET_BRANCH" ] && [[ "$PR_BODY" =~ (Fixes|Fix|Closes|Close|Resolves|Resolve)[[:space:]]+#([0-9]+) ]]; then
            ISSUE_NUM="${BASH_REMATCH[2]}"
            echo "Found linked issue #$ISSUE_NUM. Fetching issue details..."
            ISSUE_BODY=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json body --jq '.body' 2>/dev/null || true)
            if [[ "$ISSUE_BODY" =~ [Tt]arget\ [Bb]ranch:?\ ?\`?([a-zA-Z0-9_./-]+)\`? ]]; then
              TARGET_BRANCH="${BASH_REMATCH[1]}"
              echo "Found target branch in linked issue #$ISSUE_NUM: $TARGET_BRANCH"
            fi
          fi

          # 3. Default to develop if no target branch was identified
          if [ -z "$TARGET_BRANCH" ]; then
            echo "No specific target branch found; defaulting to 'develop'."
            TARGET_BRANCH="develop"
          fi

          # 4. Verify that the branch exists in the repository
          if gh api "repos/$REPO/branches/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Branch '$TARGET_BRANCH' verified in repository."
          else
            echo "Branch '$TARGET_BRANCH' does not exist in repository; falling back to 'develop'."
            TARGET_BRANCH="develop"
          fi

          echo "Retargeting PR $PR_URL to base branch '$TARGET_BRANCH'..."
          gh pr edit "$PR_URL" --base "$TARGET_BRANCH"
          echo "Successfully retargeted PR $PR_URL to '$TARGET_BRANCH'."
