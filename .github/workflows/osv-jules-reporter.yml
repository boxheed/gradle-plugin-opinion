name: OSV Vulnerability Scan & Jules Remediation

on:
  schedule:
    # Run daily at 04:00 UTC to catch newly published advisories as early as possible
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: parse and preview issues without creating them'
        type: boolean
        default: false
        required: false
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  issues: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permissions for gradlew and scripts
        run: |
          chmod +x ./gradlew
          chmod +x .github/scripts/report_osv_to_jules.py

      - name: Run OSV Lock and Scan
        id: scan
        run: ./gradlew osvInstall osvLockAndScan
        continue-on-error: true

      - name: Report Findings to Jules via GitHub Issues
        if: steps.scan.outcome == 'failure' || inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.JULES_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          # Use PR head branch if triggered by pull_request, otherwise use current branch
          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"

          python3 .github/scripts/report_osv_to_jules.py \
            --report build/osv-scanner/osv-scanner-scan.json \
            --target-branch "$TARGET_BRANCH" \
            $DRY_RUN_FLAG

      - name: Gate Check
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Vulnerabilities detected by OSV Scanner."
          exit 1
