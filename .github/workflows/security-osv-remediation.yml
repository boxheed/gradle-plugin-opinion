name: 'Security: OSV Scan & Remediation'

on:
  schedule:
    # Run daily at 04:00 UTC to catch newly published advisories as early as possible
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: scan and preview prompt without triggering Jules'
        type: boolean
        default: false
        required: false
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permissions for gradlew and scripts
        run: |
          chmod +x ./gradlew
          chmod +x .github/scripts/prepare_jules_prompt.py

      - name: Run OSV Lock and Scan
        id: scan
        run: ./gradlew osvInstall osvLockAndScan
        continue-on-error: true

      - name: Prepare Jules Remediation Prompt
        id: prepare-prompt
        if: (steps.scan.outcome == 'failure' || inputs.dry_run) && !startsWith(github.head_ref || github.ref_name, 'fix/remediate-') && !startsWith(github.head_ref || github.ref_name, 'jules/')
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

          python3 .github/scripts/prepare_jules_prompt.py \
            --report build/osv-scanner/osv-scanner-scan.json \
            --target-branch "$TARGET_BRANCH" \
            --output prompt.txt

          if [ -s prompt.txt ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "prompt<<$EOF" >> "$GITHUB_OUTPUT"
            cat prompt.txt >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$JULES_API_KEY" ]; then
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_api_key=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Jules Remediation via Jules API
        if: steps.scan.outcome == 'failure' && !inputs.dry_run && steps.prepare-prompt.outputs.has_vulnerabilities == 'true' && steps.prepare-prompt.outputs.has_api_key == 'true'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ steps.prepare-prompt.outputs.target_branch }}
          prompt: ${{ steps.prepare-prompt.outputs.prompt }}

      - name: Check for Missing JULES_API_KEY Secret
        if: steps.scan.outcome == 'failure' && !inputs.dry_run && steps.prepare-prompt.outputs.has_vulnerabilities == 'true' && steps.prepare-prompt.outputs.has_api_key != 'true'
        run: |
          echo "::warning::JULES_API_KEY secret is not configured. Add JULES_API_KEY from https://jules.google.com/settings to repository secrets to enable autonomous remediation."

      - name: Gate Check
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Vulnerabilities detected by OSV Scanner."
          exit 1
